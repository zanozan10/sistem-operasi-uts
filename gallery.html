    <!-- ===== CAROUSEL UTAMA ===== -->
    <div class="container mt-5">
      <h1 class="text-center mb-4">Momen Spesial</h1>
      <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#heroCarousel"
            data-bs-slide-to="0"
            class="active"
          ></button>
          <button
            type="button"
            data-bs-target="#heroCarousel"
            data-bs-slide-to="1"
          ></button>
          <button
            type="button"
            data-bs-target="#heroCarousel"
            data-bs-slide-to="2"
          ></button>
        </div>
        <div class="carousel-inner rounded-3 shadow-lg">
          <div class="carousel-item active">
            <img src="img/pp1.jpg" alt="Slide 1" class="d-block w-100" />
          </div>
          <div class="carousel-item">
            <img src="img/pp2.jpg" alt="Slide 2" class="d-block w-100" />
          </div>
          <div class="carousel-item">
            <img src="img/pp3.jpg" alt="Slide 3" class="d-block w-100" />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#heroCarousel"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#heroCarousel"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </div>
