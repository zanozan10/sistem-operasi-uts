    <!-- ===== FORM PENDAFTARAN ===== -->
    <div class="container my-5" style="max-width: 900px">
      <div class="glass-card">
        <h2 class="text-center mb-4">
          <i class="fas fa-user-plus me-2" style="color: var(--primary)"></i
          >Form Pendaftaran
        </h2>

        <form>
          <!-- DATA PRIBADI -->
          <h5 class="mb-3" style="color: var(--primary)">
            <i class="fas fa-user me-2"></i>Data Pribadi
          </h5>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label">Nama Depan</label>
              <input type="text" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Nama Belakang</label>
              <input type="text" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">E-mail</label>
              <input type="email" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">No HP</label>
              <input type="number" class="form-control" required />
            </div>
            <div class="col-12">
              <label class="form-label">Alamat</label>
              <input type="text" class="form-control" required />
            </div>
            <div class="col-md-4">
              <label class="form-label">Agama</label>
              <select class="form-select" required>
                <option value="">-- Pilih --</option>
                <option>Islam</option>
                <option>Kristen</option>
                <option>Katolik</option>
                <option>Hindu</option>
                <option>Budha</option>
                <option>Konghucu</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Jenis Kelamin</label>
              <select class="form-select" required>
                <option value="">-- Pilih --</option>
                <option>Laki-laki</option>
                <option>Perempuan</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Pekerjaan</label>
              <select class="form-select" required>
                <option value="">-- Pilih --</option>
                <option>Swasta</option>
                <option>PNS</option>
                <option>TNI</option>
                <option>Polri</option>
                <option>Dokter</option>
                <option>Programmer</option>
                <option>DPR</option>
                <option>Guru</option>
                <option>Dosen</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">NIK / No KTP</label>
              <input type="number" class="form-control" required />
            </div>
          </div>

          <!-- SOSIAL MEDIA -->
          <h5 class="mb-3" style="color: var(--primary)">
            <i class="fas fa-share-alt me-2"></i>Sosial Media
          </h5>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label">Url Facebook</label>
              <input type="text" class="form-control" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Url Instagram</label>
              <input type="text" class="form-control" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Url Website</label>
              <input type="text" class="form-control" />
            </div>
          </div>

          <!-- DATA ORANG TUA -->
          <h5 class="mb-3" style="color: var(--primary)">
            <i class="fas fa-users me-2"></i>Data Orang Tua
          </h5>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label">Nama Ayah</label>
              <input type="text" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Nama Ibu</label>
              <input type="text" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Alamat Ayah</label>
              <input type="text" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Alamat Ibu</label>
              <input type="text" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Pekerjaan Ayah</label>
              <select class="form-select">
                <option value="">-- Pilih --</option>
                <option>Swasta</option>
                <option>PNS</option>
                <option>TNI</option>
                <option>Polri</option>
                <option>Dokter</option>
                <option>Programmer</option>
                <option>DPR</option>
                <option>Guru</option>
                <option>Dosen</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Pekerjaan Ibu</label>
              <select class="form-select">
                <option value="">-- Pilih --</option>
                <option>Swasta</option>
                <option>PNS</option>
                <option>TNI</option>
                <option>Polri</option>
                <option>Dokter</option>
                <option>Programmer</option>
                <option>DPR</option>
                <option>Guru</option>
                <option>Dosen</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Penghasilan Ayah</label>
              <input type="text" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Penghasilan Ibu</label>
              <input type="text" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">No HP Ayah</label>
              <input type="number" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label">No HP Ibu</label>
              <input type="number" class="form-control" />
            </div>
          </div>

          <!-- SUBMIT -->
          <div class="text-center mt-4">
            <button type="submit" class="btn-primary-custom px-5">
              <i class="fas fa-check me-2"></i>Submit
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ===== FOOTER ===== -->

</html>
